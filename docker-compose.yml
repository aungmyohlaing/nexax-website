# Website Docker — local smoke test before Cloud Run
#
#   docker compose up --build
#   # or: npm run docker:up
#
# Open http://localhost:3002

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: website

    ports:
      - "${WEBSITE_PORT:-3002}:8080"

    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3002}
      NUXT_PUBLIC_GTM_ID: ${NUXT_PUBLIC_GTM_ID:-}
      NUXT_RESEND_API_KEY: ${NUXT_RESEND_API_KEY:-}
      NUXT_RESEND_FROM: ${NUXT_RESEND_FROM:-}
      NUXT_RESEND_TO: ${NUXT_RESEND_TO:-}

    restart: unless-stopped
